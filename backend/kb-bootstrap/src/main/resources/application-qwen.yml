# 激活方式：spring.profiles.active=qwen
# 或环境变量 SPRING_PROFILES_ACTIVE=qwen
# 需配置 DASHSCOPE_API_KEY；切换 profile 后请重建文档向量（勿与 ollama collection 混用）
kb:
  milvus:
    collection: kb_chunks_rbac_qwen
    # qwen3.7-text-embedding 默认 1024（可与 embed-dimensions 对齐）
    dimension: 1024
  ai:
    embedding-provider: dashscope
    llm-provider: dashscope
  dashscope:
    api-key: ${ENTERPRISE_ALI_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    embed-model: qwen3.7-text-embedding
    embed-dimensions: 1024
    llm-model: qwen3.7-plus
    # qwen3.7-plus 默认会开思考；知识库场景建议 false
    enable-thinking: false
    temperature: 0.2
    connect-timeout-ms: 10000
    read-timeout-ms: 300000
