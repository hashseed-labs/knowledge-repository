server:
  port: 8088

spring:
  application:
    name: knowledge-repository
  profiles:
    # ollama | qwen
    active: ${SPRING_PROFILES_ACTIVE:qwen}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://localhost:3306/knowledge_kb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

kb:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  jwt:
    secret: ${KB_JWT_SECRET:knowledge-repository-dev-secret-change-me-32bytes}
    access-token-ttl-minutes: 120
    refresh-token-ttl-days: 7
  seed:
    enabled: true
    admin-username: admin
    admin-password: admin123
    tenant-code: default
    tenant-name: 默认组织
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: kb-docs
  milvus:
    host: localhost
    port: 19530
    top-k: 5
    # collection / dimension 由 profile（ollama | qwen）覆盖
  etcd:
    endpoints: http://127.0.0.1:2379
    config-prefix: /kb/config
  chunk:
    max-chars: 600
    overlap-chars: 80
  rag:
    system-prompt: |
      你是企业知识库助手。请仅依据给定的检索上下文回答用户问题。
      如果上下文不足以回答，请明确说明“根据现有知识库资料无法确定”。
      回答使用 Markdown，条理清晰。

logging:
  level:
    com.knowledge.kb: INFO
